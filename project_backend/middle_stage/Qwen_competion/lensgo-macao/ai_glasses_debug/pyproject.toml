[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glasses"
version = "0.1.0"
description = "博维智慧 AI 眼镜 QwenPaw 联调服务端与联调客户端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
glasses-server = "glasses.server.app:main"
glasses-client = "glasses.client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glasses*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
